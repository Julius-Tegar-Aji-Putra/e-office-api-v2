services:
  backend:
    container_name: e-office-api-v2-backend
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
    depends_on:
      - postgres
      - minio
    ports:
      - "3001:3001"
    networks:
      - default

  postgres:
    container_name: e-office-api-v2-postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=e-office-api-v2
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=e-office-api-v2
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default

  minio:
    container_name: e-office-api-v2-minio
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - default
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
  
  createbuckets:
    image: minio/mc
    depends_on:
      - minio
    networks:
      - default
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/e-office-storage;
      /usr/bin/mc policy set public myminio/e-office-storage;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
    
networks:
  default: {}